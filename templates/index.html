<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hybrid Research Agent</title>
<style>
  :root {
    --bg: #0f1117; --panel: #1a1d27; --border: #2a2e3d;
    --text: #e6e8ee; --muted: #8a8fa3;
    --local: #4ade80; --cloud: #60a5fa; --accent: #7c6cf5;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px;
    margin-bottom: 8px; font-weight: 600;
  }
  .badge.local { background: rgba(74,222,128,.15); color: var(--local); }
  .badge.cloud { background: rgba(96,165,250,.15); color: var(--cloud); }
  .badge.error { background: rgba(248,113,113,.15); color: #f87171; }
  .steps { margin-top: 10px; color: var(--muted); font-size: 12.5px; }
  .steps summary { cursor: pointer; }
  .steps li { margin: 4px 0 0 16px; }
  .typing { align-self: flex-start; color: var(--muted); font-style: italic; }
  form {
    display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border);
  }
  input {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 11px 14px; border-radius: 10px; font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none; padding: 11px 22px;
    border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .examples { padding: 0 20px 8px; color: var(--muted); font-size: 12.5px; }
  .examples span { cursor: pointer; text-decoration: underline; margin-right: 12px; }
</style>
</head>
<body>
<header>
  <h1>🤖 Hybrid Research Agent</h1>
  <span class="sub">local 8b ⇄ cloud, routed automatically</span>
</header>
<div id="chat">
  <div class="examples" id="examples">Try:
    <span>What is the weather in McKinney?</span>
    <span>Who was Ada Lovelace?</span>
    <span>Compare solar vs nuclear energy with pros and cons</span>
  </div>
</div>
<form id="ask-form">
  <input id="question" type="text" placeholder="Ask your research agent something..." autocomplete="off" autofocus>
  <button id="send" type="submit">Send</button>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('ask-form');
const input = document.getElementById('question');
const send = document.getElementById('send');

document.getElementById('examples').addEventListener('click', (e) => {
  if (e.target.tagName === 'SPAN') { input.value = e.target.textContent; form.requestSubmit(); }
});

function addMsg(cls, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  addMsg('user', escapeHtml(q));
  const typing = addMsg('typing', 'Thinking…');
  send.disabled = true;

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q}),
    });
    const data = await res.json();
    typing.remove();
    if (data.error) {
      addMsg('bot', '<span class="badge error">error</span>' + escapeHtml(data.error));
    } else {
      const r = data.route;
      const badge = r.backend === 'local'
        ? '<span class="badge local">⚡ local · ' + escapeHtml(r.model) + '</span>'
        : '<span class="badge cloud">☁️ cloud · ' + escapeHtml(r.model) + '</span>';
      let stepsHtml = '';
      if (data.steps && data.steps.length) {
        const items = data.steps.map(s =>
          '<li>step ' + s.step + ': <b>' + escapeHtml(s.action) + '</b>' +
          (s.detail ? ' — ' + escapeHtml(s.detail) : '') + '</li>').join('');
        stepsHtml = '<details class="steps"><summary>' + data.steps.length +
                    ' agent step(s) · routed by ' + escapeHtml(r.tier) +
                    ': ' + escapeHtml(r.reason) + '</summary><ul>' + items + '</ul></details>';
      }
      addMsg('bot', badge + escapeHtml(data.answer) + stepsHtml);
    }
  } catch (err) {
    typing.remove();
    addMsg('bot', '<span class="badge error">error</span>Could not reach the server. Is web_app.py running?');
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
